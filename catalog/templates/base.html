<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dataset Freshness{% endblock %}</title>
  <style>
    :root { --bg:#f7f7f8; --card:#fff; --line:#e4e4e7; --ink:#18181b; --muted:#71717a;
            --accent:#4f46e5; --fresh:#16a34a; --stale:#d97706; --fail:#dc2626; --never:#6b7280; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
           background:var(--bg); color:var(--ink); }
    header { background:var(--card); border-bottom:1px solid var(--line); padding:14px 20px; }
    header h1 { margin:0; font-size:18px; }
    nav { margin-top:8px; display:flex; gap:16px; }
    nav a { color:var(--accent); text-decoration:none; font-weight:500; }
    nav a:hover { text-decoration:underline; }
    main { max-width:960px; margin:24px auto; padding:0 16px; }
    .cards { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
    .stat { background:var(--card); border:1px solid var(--line); border-radius:10px;
            padding:12px 16px; min-width:120px; flex:1; }
    .stat .n { font-size:26px; font-weight:700; }
    .stat .l { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
    table { width:100%; border-collapse:collapse; background:var(--card);
            border:1px solid var(--line); border-radius:10px; overflow:hidden; }
    th,td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); font-size:14px; }
    th { background:#fafafa; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
    tr:last-child td { border-bottom:none; }
    .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; color:#fff; }
    .badge.fresh { background:var(--fresh); } .badge.stale { background:var(--stale); }
    .badge.failing { background:var(--fail); } .badge.never { background:var(--never); }
    .muted { color:var(--muted); }
    button { border:none; border-radius:7px; padding:6px 11px; font-size:13px; cursor:pointer; color:#fff; }
    button.ok { background:var(--accent); } button.bad { background:#fff; color:var(--fail); border:1px solid var(--fail); }
    button:hover { opacity:.9; }
    .actions { display:flex; gap:6px; }
    .msg { padding:10px 14px; border-radius:8px; margin-bottom:10px; font-size:14px; }
    .msg.success { background:#dcfce7; color:#166534; } .msg.error { background:#fee2e2; color:#991b1b; }
    .empty { text-align:center; color:var(--muted); padding:32px; }
  </style>
</head>
<body>
  <header>
    <h1>📊 Dataset Freshness Tracker</h1>
    <nav>
      <a href="{% url 'catalog:dashboard' %}">Dashboard</a>
      <a href="{% url 'catalog:history' %}">Refresh history</a>
      <a href="/admin/">Admin</a>
    </nav>
  </header>
  <main>
    {% if messages %}{% for message in messages %}
      <div class="msg {{ message.tags }}">{{ message }}</div>
    {% endfor %}{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
