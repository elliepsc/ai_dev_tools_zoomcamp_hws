apiVersion: 1

# Fixed UIDs so the dashboard, the alert rule and the correlations reference them reliably.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      # log line -> trace: trace_id is OTLP structured metadata on every app log
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: View trace

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      nodeGraph:
        enabled: true
      # trace/span -> logs of the same trace
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: true
        filterBySpanID: false
        tags:
          - key: service.name
            value: service_name
      # span -> request metrics of the same route
      tracesToMetrics:
        datasourceUid: prometheus
        tags:
          - key: http.route
            value: http_route
        queries:
          - name: Request rate by status
            query: sum by (http_response_status_code) (rate(app_http_requests_total{$$__tags}[5m]))
