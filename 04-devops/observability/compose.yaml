# Telemetry pipeline: app --OTLP--> Collector --> Prometheus (metrics)
#                                              --> Loki (logs)
#                                              --> Tempo (traces)
# Grafana reads the three backends. Every UI port is bound to 127.0.0.1 only.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"   # OTLP/HTTP (optional, for local tests)
    depends_on: [prometheus, loki, tempo]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --web.enable-otlp-receiver          # the Collector pushes OTLP to /api/v1/otlp
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.6.17
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped

  # Tempo runs as uid 10001; a fresh named volume is root-owned (upstream pattern).
  tempo-init:
    image: grafana/tempo:2.10.8
    user: root
    entrypoint: ["chown", "10001:10001", "/var/tempo"]
    volumes:
      - tempo-data:/var/tempo
    restart: "no"

  tempo:
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.12
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3000}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Shared secret sent by the webhook contact point to the responder.
      RESPONDER_URL: ${RESPONDER_URL:-http://host.docker.internal:8001/alerts}
      RESPONDER_TOKEN: ${RESPONDER_TOKEN:-change-me-local-only}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # the responder runs on the host
    volumes:
      - ./grafana/provisioning/datasources/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./grafana/provisioning/dashboards/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./grafana/provisioning/alerting/contact-points.yaml:/etc/grafana/provisioning/alerting/contact-points.yaml:ro
      - ./grafana/provisioning/alerting/policies.yaml:/etc/grafana/provisioning/alerting/policies.yaml:ro
      - ./alerts.yaml:/etc/grafana/provisioning/alerting/alert-rules.yaml:ro
      - ./dashboard.json:/etc/grafana/dashboards/order-tracker.json:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus, loki, tempo]
    restart: unless-stopped

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
