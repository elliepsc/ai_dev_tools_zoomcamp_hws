[project]
name = "order-tracker-responder"
version = "0.1.0"
description = "Alert-driven first responder: evidence -> headless coding agent -> policy gate -> runbook -> verification"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "jsonschema>=4.20,<5",
]

[project.scripts]
responder = "responder.server:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["responder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
