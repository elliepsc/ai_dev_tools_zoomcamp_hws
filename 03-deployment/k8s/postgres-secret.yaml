# Local/demo credentials only. For a shared cluster, create this Secret out of
# band (kubectl create secret ..., SealedSecrets, External Secrets) and delete
# this file from the kustomization.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: agent-relay
type: Opaque
stringData:
  POSTGRES_USER: relay
  POSTGRES_PASSWORD: relay-local-only
  POSTGRES_DB: relay
  # Host "postgres" = the Service below (postgres.agent-relay.svc.cluster.local).
  RELAY_DATABASE_URL: postgresql://relay:relay-local-only@postgres:5432/relay
