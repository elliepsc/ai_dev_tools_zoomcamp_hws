# PostgreSQL as a single-replica StatefulSet with a PersistentVolumeClaim, so
# data survives pod restarts/rescheduling (kind's default "standard"
# StorageClass provisions a hostPath-backed volume on the node).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: agent-relay
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: agent-relay}
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: agent-relay
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: agent-relay}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: agent-relay}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - {name: postgres, containerPort: 5432}
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            # Subdirectory: some volume types contain lost+found at the root,
            # which initdb refuses to use.
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -h 127.0.0.1"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
