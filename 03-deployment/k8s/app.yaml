apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-relay-config
  namespace: agent-relay
data:
  RELAY_LEASE_SECONDS: "60"
  RELAY_MAX_ATTEMPTS: "5"
  RELAY_DB_CONNECT_RETRIES: "60"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-relay
  namespace: agent-relay
  labels: {app.kubernetes.io/name: agent-relay, app.kubernetes.io/part-of: agent-relay}
spec:
  # The Deployment (via its ReplicaSet) keeps 2 API pods running and performs
  # rolling updates when the image tag changes. Claims are safe across
  # replicas thanks to SELECT ... FOR UPDATE SKIP LOCKED in PostgreSQL.
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app.kubernetes.io/name: agent-relay}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never drop below the requested capacity during a rollout
      maxSurge: 1
  template:
    metadata:
      labels: {app.kubernetes.io/name: agent-relay, app.kubernetes.io/part-of: agent-relay}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          # Loaded into the cluster with `kind load docker-image`; CI replaces
          # the tag with a unique one per build (kubectl set image).
          image: agent-relay:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef:
                name: agent-relay-config
          env:
            - name: RELAY_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: RELAY_DATABASE_URL}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 60
          # Ready = DB reachable AND schema present; not-ready pods get no traffic.
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness deliberately does not depend on the DB, so a DB outage
          # does not restart every API pod.
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-relay
  namespace: agent-relay
  labels: {app.kubernetes.io/name: agent-relay, app.kubernetes.io/part-of: agent-relay}
spec:
  selector: {app.kubernetes.io/name: agent-relay}
  ports:
    - name: http
      port: 8000
      targetPort: http
